<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人博客风格筛选 · 33 个 Demo</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101114;
    --panel: #17191e;
    --panel-2: #1d2026;
    --line: #2b2f37;
    --text: #f3f4f6;
    --muted: #959ba7;
    --accent: #c8ff5c;
    --accent-ink: #172006;
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, a { font: inherit; }
  button { color: inherit; }
  button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .app {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    width: 100%;
    height: 100dvh;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    min-height: 72px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    background: #121418;
  }
  .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .brand-mark {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    flex: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font: 800 15px/1 ui-monospace, Consolas, monospace;
    letter-spacing: -.04em;
  }
  .brand h1 { margin: 0; font-size: 18px; line-height: 1.25; letter-spacing: -.02em; }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .top-meta { display: flex; align-items: center; gap: 10px; flex: none; }
  .count {
    padding: 7px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: #d8dce4;
    background: #191c21;
    font: 700 12px/1 ui-monospace, Consolas, monospace;
  }
  .key-hint { color: var(--muted); font-size: 12px; }
  kbd {
    display: inline-grid;
    place-items: center;
    min-width: 22px;
    height: 22px;
    margin: 0 2px;
    border: 1px solid #3a3f49;
    border-bottom-width: 2px;
    border-radius: 5px;
    background: #20242a;
    color: #dfe3ea;
    font: 11px/1 ui-monospace, Consolas, monospace;
  }

  .workspace {
    display: grid;
    grid-template-columns: 304px minmax(0, 1fr);
    min-height: 0;
  }

  .sidebar {
    min-height: 0;
    overflow: auto;
    border-right: 1px solid var(--line);
    background: var(--panel);
    scrollbar-color: #3b404a transparent;
    scrollbar-width: thin;
  }
  .sidebar-head {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 18px 12px;
    background: linear-gradient(var(--panel) 82%, transparent);
  }
  .sidebar-head h2 { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .sidebar-head span { color: var(--muted); font: 11px/1 ui-monospace, Consolas, monospace; }
  .demo-list { display: grid; gap: 5px; padding: 0 10px 18px; }
  .demo-item {
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 57px;
    padding: 8px 10px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    text-align: left;
    cursor: pointer;
    transition: background .16s ease, border-color .16s ease;
  }
  .demo-item:hover { background: #20242a; }
  .demo-item.on { border-color: #3c462d; background: #252c20; }
  .demo-num {
    color: #737b88;
    font: 700 13px/1 ui-monospace, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .demo-item.on .demo-num { color: var(--accent); }
  .demo-copy { min-width: 0; }
  .demo-copy b {
    display: block;
    overflow: hidden;
    color: #e8ebf0;
    font-size: 13px;
    font-weight: 650;
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .demo-copy small {
    display: block;
    overflow: hidden;
    margin-top: 3px;
    color: #868e9a;
    font-size: 11px;
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .demo-group {
    align-self: start;
    margin-top: 3px;
    padding: 3px 6px;
    border-radius: 4px;
    background: #2a2e35;
    color: #aeb5c0;
    font-size: 9px;
    line-height: 1.2;
    white-space: nowrap;
  }
  .demo-item.on .demo-group { background: #39452a; color: #d8f7a2; }

  .preview {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    min-width: 0;
    min-height: 0;
    background: #0c0d10;
  }
  .preview-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    min-height: 62px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    background: #15171b;
  }
  .current { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .current-num {
    color: var(--accent);
    font: 800 18px/1 ui-monospace, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .current-title {
    overflow: hidden;
    margin: 0;
    font-size: 14px;
    font-weight: 650;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .preview-actions { display: flex; align-items: center; gap: 7px; flex: none; }
  .icon-btn, .open-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 36px;
    border: 1px solid #343942;
    border-radius: 8px;
    background: #20242a;
    color: #dfe3e9;
    text-decoration: none;
    cursor: pointer;
  }
  .icon-btn { width: 36px; padding: 0; font-size: 17px; }
  .open-btn { padding: 0 12px; font-size: 12px; }
  .icon-btn:hover:not(:disabled), .open-btn:hover { border-color: #59616e; background: #292e36; }
  .icon-btn:disabled { opacity: .32; cursor: default; }

  .frame-wrap { min-width: 0; min-height: 0; padding: 12px; }
  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 1px solid #2a2e35;
    border-radius: 10px;
    background: #fff;
  }

  @media (max-width: 820px) {
    .topbar { min-height: 62px; padding: 11px 14px; }
    .brand-mark { width: 36px; height: 36px; border-radius: 10px; }
    .brand h1 { font-size: 15px; }
    .brand p, .key-hint { display: none; }
    .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(176px, 34vh) minmax(0, 1fr); }
    .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
    .sidebar-head { padding: 12px 14px 8px; }
    .demo-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 0 8px 12px; }
    .demo-item { min-height: 51px; grid-template-columns: 31px minmax(0, 1fr); gap: 7px; padding: 7px 8px; }
    .demo-group { display: none; }
    .demo-copy b { font-size: 12px; }
    .demo-copy small { font-size: 10px; }
    .preview-bar { min-height: 54px; padding: 8px 12px; gap: 10px; }
    .current { gap: 8px; }
    .current-title { font-size: 12px; }
    .open-btn { width: 36px; padding: 0; }
    .open-btn span { display: none; }
    .frame-wrap { padding: 7px; }
    iframe { border-radius: 7px; }
  }

  @media (max-width: 460px) {
    .count { padding: 6px 8px; font-size: 10px; }
    .demo-list { grid-template-columns: 1fr; }
    .workspace { grid-template-rows: minmax(150px, 31vh) minmax(0, 1fr); }
  }
</style>
</head>

<script>
  const items = [...document.querySelectorAll('.demo-item')];
  const frame = document.getElementById('previewFrame');
  const currentNum = document.getElementById('currentNum');
  const currentTitle = document.getElementById('currentTitle');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const openBtn = document.getElementById('openBtn');
  let current = 0;

  function selectDemo(index, updateHash = true) {
    current = Math.max(0, Math.min(items.length - 1, index));
    const item = items[current];
    const num = item.querySelector('.demo-num').textContent;
    const title = item.dataset.title;

    items.forEach((el, i) => el.classList.toggle('on', i === current));
    currentNum.textContent = num;
    currentTitle.textContent = title;
    frame.src = item.dataset.src;
    frame.title = `Demo 预览：${title}`;
    openBtn.href = item.dataset.src;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === items.length - 1;
    document.title = `${num} · ${title}｜个人博客风格筛选`;

    const active = items[current];
    const sidebar = document.querySelector('.sidebar');
    const itemRect = active.getBoundingClientRect();
    const sideRect = sidebar.getBoundingClientRect();
    if (itemRect.top < sideRect.top || itemRect.bottom > sideRect.bottom) {
      active.scrollIntoView({ block: 'nearest' });
    }

    if (updateHash) history.replaceState(null, '', `#${num}`);
  }

  items.forEach((item, index) => {
    item.addEventListener('click', () => selectDemo(index));
  });

  prevBtn.addEventListener('click', () => selectDemo(current - 1));
  nextBtn.addEventListener('click', () => selectDemo(current + 1));

  addEventListener('keydown', (event) => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
    if (event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
      event.preventDefault();
      selectDemo(current - 1);
    }
    if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
      event.preventDefault();
      selectDemo(current + 1);
    }
  });

  addEventListener('hashchange', () => {
    const index = items.findIndex(item => item.querySelector('.demo-num').textContent === location.hash.slice(1));
    if (index >= 0) selectDemo(index, false);
  });

  const initial = items.findIndex(item => item.querySelector('.demo-num').textContent === location.hash.slice(1));
  selectDemo(initial >= 0 ? initial : 0, false);
</script>
